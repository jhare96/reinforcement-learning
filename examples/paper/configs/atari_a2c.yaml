# A2C Atari baseline (Table: A2C Atari) — Hare 2019, Sec. 3.1.
#
# Run:  python -m rlib.A2C examples/paper/configs/atari_a2c.yaml
#
# Sweep all three paper Atari envs:
#   for env in ALE/Freeway-v5 ALE/MontezumaRevenge-v5 ALE/SpaceInvaders-v5; do
#     python -m rlib.A2C examples/paper/configs/atari_a2c.yaml --set env.id=$env
#   done

env:
  constructor: rlib._cli.atari_envs
  id: ALE/SpaceInvaders-v5
  num_envs: 32
  num_val_envs: 8
  frame_stack: 4
  episodic: true
  clip_reward: true
  fire_reset: true                 # paper uses FireResetEnv

agent:
  constructor: rlib.A2C.ActorCritic
  model:
    constructor: rlib.models.NatureCNN
    partial: true
  input_size: ${input_shape}
  action_size: ${action_size}
  optim:
    constructor: torch.optim.Adam
    partial: true
  config:
    constructor: rlib.A2C.A2CConfig
    lr: 1.0e-3
    lr_final: 1.0e-3               # constant LR (paper does no decay for A2C baseline)
    decay_steps: 1000000000
    grad_clip: 0.5
    entropy_coeff: 0.01
    value_coeff: 0.5
    device: ${device}

trainer:
  constructor: rlib.A2C.A2CTrainer
  envs: ${train_envs}
  val_envs: ${val_envs}
  agent: ${agent}
  config:
    constructor: rlib.training.TrainerConfig
    total_steps: 50_000_000
    nsteps: 5
    gamma: 0.99
    validate_freq: 1_000_000
    num_val_episodes: 8
    max_val_steps: 4500
    log_dir: logs/paper/A2C/SpaceInvaders
    model_dir: models/paper/A2C/SpaceInvaders
