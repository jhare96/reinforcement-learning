# RND with PPO Classic Control — Hare 2019, Sec. 3.4 sparse-reward solutions.
# Same base policy hyperparameters as classic-control PPO, with γ_e and γ_i
# from the RND Atari table.
#
# Run: python -m rlib.RND examples/paper/configs/classic_rnd.yaml

env:
  constructor: rlib._cli.classic_envs
  id: MountainCar-v0
  num_envs: 32
  num_val_envs: 8

agent:
  constructor: rlib.RND.RND
  policy_model:
    constructor: rlib.models.MLP
    partial: true
  target_model:
    constructor: rlib.RND.PredictorMLP
    partial: true
  input_size: ${input_shape}
  action_size: ${action_size}
  intr_coeff: 1.0
  extr_coeff: 2.0
  optim:
    constructor: torch.optim.RMSprop
    partial: true
  config:
    constructor: rlib.PPO.PPOConfig
    lr: 1.0e-3
    lr_final: 1.0e-3
    decay_steps: 1000000000
    grad_clip: 0.5
    entropy_coeff: 0.01
    policy_clip: 0.1
    device: ${device}

trainer:
  constructor: rlib.RND.RNDTrainer
  envs: ${train_envs}
  val_envs: ${val_envs}
  agent: ${agent}
  config:
    constructor: rlib.RND.RNDTrainerConfig
    total_steps: 2_000_000
    nsteps: 5
    gamma: 0.999
    gamma_intr: 0.99
    lambda_: 0.95
    returns: GAE
    init_obs_steps: 250
    num_epochs: 4
    num_minibatches: 1
    validate_freq: 100_000
    num_val_episodes: 8
    max_val_steps: 500
    log_dir: logs/paper/RND/MountainCar
    model_dir: models/paper/RND/MountainCar
