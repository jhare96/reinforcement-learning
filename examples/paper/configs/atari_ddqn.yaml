# Synchronous n-step Double-DQN Atari baseline (Table: DDQN Atari) — Sec. 3.1.
#
# Run: python -m rlib.DDQN examples/paper/configs/atari_ddqn.yaml

env:
  constructor: rlib._cli.atari_envs
  id: ALE/SpaceInvaders-v5
  num_envs: 32
  num_val_envs: 8
  frame_stack: 4
  episodic: true
  clip_reward: true
  fire_reset: true

agent:
  constructor: rlib.DDQN.DQN
  model:
    constructor: rlib.models.NatureCNN
    partial: true
  input_shape: ${input_shape}
  action_size: ${action_size}
  optim:
    constructor: torch.optim.Adam
    partial: true
  config:
    constructor: rlib.agent.ModelConfig
    lr: 1.0e-3
    lr_final: 1.0e-3
    decay_steps: 1000000000
    grad_clip: 0.5
    device: ${device}

trainer:
  constructor: rlib.DDQN.SyncDDQN
  envs: ${train_envs}
  val_envs: ${val_envs}
  agent: ${agent}
  target_agent:
    constructor: rlib._cli.clone_module
    module: ${agent}
  action_size: ${action_size}
  config:
    constructor: rlib.DDQN.DDQNTrainerConfig
    total_steps: 50_000_000
    nsteps: 5
    gamma: 0.99
    update_target_freq: 10_000
    validate_freq: 1_000_000
    num_val_episodes: 8
    max_val_steps: 4500
    epsilon_start: 1.0
    epsilon_final: 0.01
    epsilon_steps: 2_000_000      # paper anneals ε over 2M steps
    epsilon_test: 0.01
    log_dir: logs/paper/DDQN/SpaceInvaders
    model_dir: models/paper/DDQN/SpaceInvaders
