# PPO Atari (Table: PPO Atari) — Hare 2019, Sec. 3.2.
#
# Run: python -m rlib.PPO examples/paper/configs/atari_ppo.yaml

env:
  constructor: rlib._cli.atari_envs
  id: ALE/SpaceInvaders-v5
  num_envs: 32
  num_val_envs: 8
  frame_stack: 4
  episodic: true
  clip_reward: true
  fire_reset: true

agent:
  constructor: rlib.PPO.PPO
  model:
    constructor: rlib.models.NatureCNN
    partial: true
  input_shape: ${input_shape}
  action_size: ${action_size}
  value_coeff: 0.5
  config:
    constructor: rlib.PPO.PPOConfig
    lr: 1.0e-4
    lr_final: 1.0e-4
    decay_steps: 12207            # 50_000_000 // (32 * 128); per-update.
    grad_clip: 0.5
    entropy_coeff: 0.01
    policy_clip: 0.1
    device: ${device}

trainer:
  constructor: rlib.PPO.PPOTrainer
  envs: ${train_envs}
  val_envs: ${val_envs}
  agent: ${agent}
  config:
    constructor: rlib.PPO.PPOTrainerConfig
    total_steps: 50_000_000
    nsteps: 128
    gamma: 0.99
    lambda_: 0.95
    returns: GAE
    num_epochs: 4
    num_minibatches: 4
    validate_freq: 1_000_000
    num_val_episodes: 8
    max_val_steps: 4500
    log_dir: logs/paper/PPO/SpaceInvaders
    model_dir: models/paper/PPO/SpaceInvaders
