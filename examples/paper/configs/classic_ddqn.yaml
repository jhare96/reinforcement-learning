# Synchronous n-step Double-DQN Classic Control — Sec. 3.4.
# Uses RMSProp (paper's preferred optimiser for low-dim envs).
#
# Run: python -m rlib.DDQN examples/paper/configs/classic_ddqn.yaml

env:
  constructor: rlib._cli.classic_envs
  id: CartPole-v1
  num_envs: 32
  num_val_envs: 8

agent:
  constructor: rlib.DDQN.DQN
  model:
    constructor: rlib.models.MLP
    partial: true
  input_shape: ${input_shape}
  action_size: ${action_size}
  optim:
    constructor: torch.optim.RMSprop
    partial: true
  config:
    constructor: rlib.agent.ModelConfig
    lr: 1.0e-3
    lr_final: 1.0e-3
    decay_steps: 1000000000
    grad_clip: 0.5
    device: ${device}

trainer:
  constructor: rlib.DDQN.SyncDDQN
  envs: ${train_envs}
  val_envs: ${val_envs}
  agent: ${agent}
  target_agent:
    constructor: rlib._cli.clone_module
    module: ${agent}
  action_size: ${action_size}
  config:
    constructor: rlib.DDQN.DDQNTrainerConfig
    total_steps: 2_000_000
    nsteps: 5
    gamma: 0.99
    lambda_: 0.95
    returns: GAE
    update_target_freq: 10_000
    validate_freq: 100_000
    num_val_episodes: 8
    max_val_steps: 500
    epsilon_start: 1.0
    epsilon_final: 0.1            # paper finds 0.1 best for classic
    epsilon_steps: 1_000_000      # anneal over half of training
    epsilon_test: 0.01
    log_dir: logs/paper/DDQN/CartPole
    model_dir: models/paper/DDQN/CartPole
