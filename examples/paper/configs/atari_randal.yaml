# RANDAL Atari (novel agent — Table: RANDAL Atari) — Hare 2019, Sec. 3.3.
# RANDAL = RND (intrinsic curiosity) + UNREAL auxiliary tasks (RP + VR + PC).
#
# Run: python -m rlib.RANDAL examples/paper/configs/atari_randal.yaml

env:
  constructor: rlib._cli.atari_envs
  id: ALE/MontezumaRevenge-v5
  num_envs: 32
  num_val_envs: 8
  frame_stack: 4
  episodic: true
  clip_reward: true
  fire_reset: true

agent:
  constructor: rlib.RANDAL.RANDAL
  policy_model:
    constructor: rlib.models.NatureCNN
    partial: true
  target_model:
    constructor: rlib.RND.PredictorCNN
    partial: true
  input_size: ${input_shape}
  action_size: ${action_size}
  intr_coeff: 1.0
  extr_coeff: 2.0
  pixel_control: true
  RP: 1.0
  VR: 1.0
  PC: 1.0
  config:
    constructor: rlib.PPO.PPOConfig
    lr: 1.0e-4
    lr_final: 1.0e-4
    decay_steps: 12207
    grad_clip: 0.5
    entropy_coeff: 0.001
    policy_clip: 0.1
    device: ${device}

trainer:
  constructor: rlib.RANDAL.RANDALTrainer
  envs: ${train_envs}
  val_envs: ${val_envs}
  agent: ${agent}
  config:
    constructor: rlib.RANDAL.RANDALTrainerConfig
    total_steps: 50_000_000
    nsteps: 128
    gamma: 0.999                  # extrinsic discount γ_e
    gamma_intr: 0.99              # intrinsic discount γ_i
    lambda_: 0.95
    returns: GAE
    init_obs_steps: 6400
    num_epochs: 4
    num_minibatches: 4
    replay_length: 2000
    norm_pixel_reward: true
    validate_freq: 1_000_000
    num_val_episodes: 8
    max_val_steps: 4500
    log_dir: logs/paper/RANDAL/MontezumaRevenge
    model_dir: models/paper/RANDAL/MontezumaRevenge
